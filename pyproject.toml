[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prompt-gen"
version = "0.1.0"
description = "本地提示词生成器 CLI：根据场景生成结构化提示词模板"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.15.0",
    "rich>=13.9.0",
    "pydantic>=2.10.0",
    "langchain-deepseek>=0.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
prompt-gen = "prompt_gen.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
